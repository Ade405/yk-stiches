name: Fix formatting

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4
        with:
          ref: chore/docker-modularize-lint-format
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply Prettier formatting
        run: npx --yes prettier@3.6.2 --write .prettierrc.json docker-compose.yml .github/workflows/ci.yml eslint.config.js src/components/AppMainContent.tsx src/components/AppOverlays.tsx src/components/AtelierFooter.tsx

      - name: Commit and push formatting fixes
        run: |
          if git diff --quiet; then
            echo "No formatting changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .prettierrc.json docker-compose.yml .github/workflows/ci.yml eslint.config.js src/components/AppMainContent.tsx src/components/AppOverlays.tsx src/components/AtelierFooter.tsx
          git commit -m "Apply Prettier formatting"
          git push
